name: Daily Cause List Update

on:
  schedule:
    - cron: "30 5 * * *"   # ~10:30 AM PKT daily
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Days back to re-check for PDFs"
        required: false
        default: "10"

permissions:
  contents: write

jobs:
  update-causelists:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Download new cause list PDFs
        env:
          BHC_LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '10' }}
        run: python scripts/download_causelists.py

      - name: Extract PDFs into Excel
        run: python scripts/extract_causelists.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/BHC_Final_File__-_Combined.xlsx
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Daily cause list update: $(date -u +'%Y-%m-%d')"
            git push
          fi
